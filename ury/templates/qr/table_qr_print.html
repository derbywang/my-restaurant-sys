<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; color: #000; }
  .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 88mm; gap: 0; }
  .card { border: 1px dashed #999; display: flex; flex-direction: column; align-items: center; justify-content: center;
          padding: 4mm; break-inside: avoid; page-break-inside: avoid; }
  .card svg { width: 52mm; height: 52mm; }
  .table { font-size: 22pt; font-weight: bold; margin-top: 3mm; }
  .sentence { font-size: 10pt; margin-top: 2mm; text-align: center; }
  /* six cards on a page: the grid is two columns by three rows of 88 mm */
  .card:nth-child(6n) { break-after: page; }
</style>
</head>
<body>
<div class="sheet">
{% for code in codes %}
  <div class="card" data-table="{{ code.table | e }}">
    {{ code.svg }}
    <div class="table">{{ code.table | e }}</div>
    <div class="sentence">{{ sentence | e }}</div>
  </div>
{% endfor %}
</div>
</body>
</html>
